| 日志 | zap | — |
| CSV | encoding/csv (stdlib) | papaparse |
| 构建 | — | Vite |

### 关键约定

1. **API 统一返回格式**: \`{ code: 0, message: "ok", data: ... }\`
2. **认证方式**: 支持两种方式——
   - **JWT Bearer Token**: 登录后获取，前端自动附加到 \`Authorization\` 头
   - **API Key**: 通过 \`X-API-Key\` 请求头发送，适用于脚本/自动化调用（如收银台 checkin）
   - 所有路由（除 \`/api/auth/login\` 和 \`/api/auth/logout\`）都需要认证
3. **CSV 编码**: UTF-8 BOM，JSON 字段双引号转义
4. **权限控制**: 通过 Role.Permissions (JSON 数组) 控制，后续可扩展 Casbin
5. **前端状态管理**: 使用 Zustand + persist（自动存储到 localStorage）

## 三、新增一个模块的完整流程

假设要新增一个「支付配置」模块，步骤如下：

### 步骤 1: 后端 — 创建 Model

\`backend/internal/model/payment.go\`:

\`\`\`go
package model

type Payment struct {
    ID       int64  \`gorm:"primaryKey;autoIncrement" json:"id"\`
    StoreID  int64  \`gorm:"column:store_id;not null;index" json:"store_id"\`
    Merchant string \`gorm:"column:merchant;size:100;not null" json:"merchant"\`
    Key      string \`gorm:"column:key;size:255" json:"key"\`
    Status   int    \`gorm:"column:status;default:1" json:"status"\`
}

func (Payment) TableName() string { return "payments" }
\`\`\`

### 新建数据库表的两种方式

#### 方式一：GORM AutoMigrate（推荐，开发阶段使用）

在 \`cmd/server/main.go\` 的 \`AutoMigrate\` 中添加 \`&model.Payment{}\`：

\`\`\`go
if err := db.AutoMigrate(
    // ... 已有模型
    &model.Payment{},  // 新增
); err != nil { ...
\`\`\`

AutoMigrate 会自动创建表、添加新增的列和索引，**但不会删除/修改已有列**。如需修改列类型或重命名，需手动执行 SQL。

**GORM 字段标签参考：**

| 标签 | 说明 | 示例 |
|------|------|------|
| \`primaryKey\` | 主键 | \`gorm:"primaryKey"\` |
| \`autoIncrement\` | 自增 | \`gorm:"autoIncrement"\` |
| \`column\` | 列名 | \`gorm:"column:store_id"\` |
| \`size\` | 字符串长度 | \`gorm:"size:100"\` |
| \`not null\` | 非空 | \`gorm:"not null"\` |
| \`default\` | 默认值 | \`gorm:"default:1"\` |
| \`index\` | 普通索引 | \`gorm:"index"\` |
| \`uniqueIndex\` | 唯一索引 | \`gorm:"uniqueIndex"\` |
| \`type:text\` | 长文本 | \`gorm:"type:text"\` |
| \`-\` | 忽略字段 | \`gorm:"-"\` \`json:"-"\` |

**常见字段类型映射：**

| Go 类型 | PostgreSQL 类型 | 适用场景 |
|---------|----------------|----------|
| \`int64\` | \`bigint\` | ID、数量 |
| \`int\` | \`integer\` | 状态、排序 |
| \`string\` + \`size\` | \`varchar(n)\` | 名称、编码 |
| \`string\` + \`type:text\` | \`text\` | JSON、长内容 |
| \`bool\` | \`boolean\` | 开关 |
| \`float64\` | \`double precision\` | 金额、比率 |
| \`time.Time\` | \`timestamptz\` | 时间 |

**模型方法 \`TableName\`：**

\`\`\`go
func (Payment) TableName() string { return "payments" }
\`\`\`

如果不定义 \`TableName\`，GORM 默认使用蛇形复数表名（如 \`payment\` → \`payments\`），建议显式指定表名。

#### 方式二：golang-migrate（推荐，生产环境使用）

项目已引入 \`golang-migrate\` 依赖，后续可启用版本化迁移：

\`\`\`bash
# 创建迁移文件
migrate create -ext sql -dir migrations -seq create_payments_table
\`\`\`

生成两个文件：

\`\`\`sql
-- migrations/000001_create_payments_table.up.sql
CREATE TABLE IF NOT EXISTS payments (
    id          BIGSERIAL PRIMARY KEY,
    store_id    BIGINT NOT NULL REFERENCES stores(id),
    merchant    VARCHAR(100) NOT NULL,
    key         VARCHAR(255),
    status      INTEGER DEFAULT 1,
    created_at  TIMESTAMPTZ DEFAULT NOW(),
    updated_at  TIMESTAMPTZ DEFAULT NOW()
);

-- migrations/000001_create_payments_table.down.sql
DROP TABLE IF EXISTS payments;
\`\`\`

然后在 \`main.go\` 中（替换 AutoMigrate）执行迁移：

\`\`\`go
import "github.com/golang-migrate/migrate/v4"

m, err := migrate.New("file://migrations", dbURL)
m.Up()
\`\`\`

### 步骤 2: 后端 — 创建 Service

\`backend/internal/service/payment.go\`:

\`\`\`go
package service

import (
    "gorm.io/gorm"
    "github.com/cashier-config/server/internal/model"
)

type PaymentService struct { db *gorm.DB }
func NewPaymentService(db *gorm.DB) *PaymentService { return &PaymentService{db: db} }

func (s *PaymentService) List() ([]model.Payment, error) {
    var list []model.Payment
    if err := s.db.Order("id ASC").Find(&list).Error; err != nil {
        return nil, err
    }
    return list, nil
}
// 其他方法: GetByID, Create, Update, Delete...
\`\`\`

### 步骤 3: 后端 — 创建 Handler

\`backend/internal/handler/payment.go\`:

\`\`\`go
package handler

import (
    "net/http"
    "strconv"
    "github.com/gin-gonic/gin"
    "github.com/cashier-config/server/internal/model"
    "github.com/cashier-config/server/internal/service"
)

type PaymentHandler struct { svc *service.PaymentService }
func NewPaymentHandler(svc *service.PaymentService) *PaymentHandler {
    return &PaymentHandler{svc: svc}
}
func (h *PaymentHandler) List(c *gin.Context) {
    list, err := h.svc.List()
    if err != nil { c.JSON(500, gin.H{"code": 500, "message": err.Error()}); return }
    c.JSON(200, gin.H{"code": 0, "message": "ok", "data": list})
}
// 其他方法: Get, Create, Update, Delete...
\`\`\`

### 步骤 4: 后端 — 在 handler 中注册路由

在 handler 文件中添加 \`Register()\` 方法实现 \`handler.Handler\` 接口，路由注册在各自文件中完成，无需修改 \`router.go\`：

\`\`\`go
// handler/payment.go
func (h *PaymentHandler) Register(api gin.IRouter, authed gin.IRouter) {
    payments := authed.Group("/payments")
    payments.GET("", h.List)
    payments.POST("", h.Create)
    payments.GET("/:id", h.Get)
    payments.PUT("/:id", h.Update)
    payments.DELETE("/:id", h.Delete)
}
\`\`\`

paymentH := handler.NewPaymentHandler(paymentSvc)

r := router.Setup([]handler.Handler{

\`\`\`

## 四、常见修改场景

### 修改数据库字段

在对应 Model 结构体中修改字段定义，GORM AutoMigrate 会自动应用变更（仅新增列，不会删除/修改已有列）。

如果需要删除或重命名字段：
1. 手动写 SQL 迁移
2. 或者使用 \`golang-migrate\`（已引入依赖但未配置，可后续启用）

### 修改 CSV 导出格式

编辑对应 Service 中的 \`ExportCSV\` 方法，修改列名或字段映射。

### 修改 CSV 导入格式

编辑对应 Service 中的 \`ImportCSV\` 方法，调整 CSV 列顺序映射。

### 修改 JWT 过期时间

编辑 \`config.yaml\`：

\`\`\`yaml
jwt:
  secret: change-me-in-production
  ttl: 24  # 单位：小时
\`\`\`

### 添加新的 API 路由

在对应 handler 文件的 \`Register()\` 方法中添加新路由，所有注册在 \`authed\` 分组的路由会自动应用 JWT / API Key 认证中间件。**无需修改 \`router/router.go\`**。

## 六、TillList 收银台接入

### 数据模型

TillList 表字段：

| 字段 | 类型 | 说明 |
|------|------|------|
| id | bigint | 主键 |
| host_name | varchar(100) | 主机名，唯一索引（对应 JSON 的 Name） |
| mac_address | varchar(20) | MAC 地址 |
| location | varchar(10) | 地区（CN/HK/TW 等） |
| store_number | varchar(20) | 门店号 |
| env | varchar(10) | 环境（pr/pp/lab） |
| name | varchar(100) | 设备名称（JSON Name 字段） |
| ip | varchar(50) | IP 地址 |
| hardware_model | varchar(50) | 硬件型号 |
| group_id | bigint | 关联 Group ID |
| request_body | text | 完整上报 JSON |
| last_seen | varchar(30) | 最近活跃时间（取自 Execution.StartTime） |

### 收银台调用接口

**POST /api/till-lists/checkin**

收银台每次启动时主动上报本地信息，后端按 \`host_name\`（即 JSON 的 \`Name\` 字段）去重，存在则更新，不存在则创建。

> **认证方式**: 使用 \`X-API-Key\` 请求头（推荐）或 JWT Bearer Token，详见[八、API Key 认证](#api-key-认证)

**请求体（Content-Type: application/json）**

\`\`\`json
{
    "Ip": "10.66.48.41",
    "TillNumber": "24",
    "Execution": {
        "EndTime": "2026-05-27 17:00:37",
        "Status": 0,
        "StartTime": "2026-05-27 17:00:31",
        "ModuleExecution": [
            {
                "Duration": 0,
                "Name": "M2_TH200i_LAB",
                "Status": true,
                "Steps": [
                    {
                        "Output": "2026-05-27 17:00:36 [Info] HWM is already installed.",
                        "Status": true,
                        "Name": "hwm",
                        "Duration": 0
                    }
                ]
            }
        ],
        "Duration": 6
    },
    "CreationTime": "2026-05-08 21:17:00",
    "Location": "CN",
    "Group": 47,
    "Fact": [
        { "Key": "TotalMemory", "Value": "16 GB", "Type": 0 },
        { "Key": "SerialNumber", "Value": "53R1199668", "Type": 0 },
        { "Key": "ChromeVersion", "Value": "147.0.7727.138", "Type": 1 }
    ],
    "StoreNumber": "806",
    "Name": "CNT080624",
    "Env": "lab",
    "HardwareModel": "A2210"
}
\`\`\`

**关键字段映射：**

| JSON 字段 | 对应表字段 | 说明 |
|-----------|-----------|------|
| Name | host_name | 主机名，唯一键 |
| MACAddress | mac_address | MAC 地址 |
| Location | location | 地区 |
| StoreNumber | store_number | 门店号 |
| Env | env | 环境 |
| Ip | ip | IP 地址 |
| HardwareModel | hardware_model | 硬件型号 |
| Group | group_id | Group ID |
| Execution.StartTime | last_seen | 最近活跃时间 |

**响应：**

\`\`\`json
{ "code": 0, "message": "ok" }
\`\`\`

**Fact 字段 Type 说明：**
- \`0\` — 静态信息（内存、序列号等）
- \`1\` — 版本信息（ChromeVersion、JavaVersion 等）

### 前端查看

访问 \`/till-lists\` 列表页，支持按主机名、地区、环境过滤。点击眼睛图标进入详情页，可查看：

1. **基本信息**：主机名、MAC、地区、门店、环境、IP、硬件型号、最近活跃时间
2. **Fact 表格**：所有静态信息和版本信息
3. **Execution 结果**：ModuleExecution 折叠面板，每个模块显示 Steps 执行输出

点击"查看上报数据"按钮可看完整原始 JSON。

## 八、认证配置

### LDAP 认证

#### 配置方式

编辑 \`backend/config.yaml\`，取消 LDAP 配置注释并修改为实际值：

\`\`\`yaml
ldap:
  enabled: true
  host: "ldap.company.com"         # LDAP 服务器地址
  port: 389                        # 端口 (389=明文, 636=LDAPS)
  base_dn: "dc=company,dc=com"     # 搜索基 DN
  bind_dn: "cn=admin,dc=company,dc=com"   # 查询绑定账号
  bind_password: "your-password"          # 绑定密码
  filter: "(objectClass=person)"          # 搜索过滤器
  uid_attr: "sAMAccountName"              # 用户名字段 (AD 用 sAMAccountName, OpenLDAP 用 uid)
  mail_attr: "mail"                       # 邮箱字段
  name_attr: "displayName"                # 显示名字段
  default_role_id: 2                      # LDAP 用户默认角色 ID
  starttls: false                         # 是否启用 StartTLS
\`\`\`

#### 工作原理

1. 用户在前端选择「LDAP」标签页，输入用户名密码
2. 后端用 \`bind_dn\` + \`bind_password\` 绑定 LDAP 服务器
3. 搜索 \`base_dn\` 下 \`uid_attr = 用户名\` 的记录
4. 用用户输入的密码验证该记录的 DN
5. 验证通过后，在本地 \`users\` 表查找或自动创建用户（\`auth_source = 'ldap'\`）
6. 返回 JWT token，后续请求与本地账号完全一致

#### 支持的 LDAP 服务器

- Microsoft Active Directory
- OpenLDAP
- FreeIPA
- 其他标准 LDAP v3 兼容服务器

#### 注意事项

- \`bind_dn\` / \`bind_password\` 需要一个有搜索权限的服务账号
- 首次 LDAP 登录会自动创建本地用户，角色为 \`default_role_id\`
- 如果 LDAP 用户名与本地用户名冲突，已存在的本地用户优先
- 修改 LDAP 配置后需重启后端

### SSO / OIDC 单点登录

#### 配置方式

编辑 \`backend/config.yaml\`，取消 SSO 配置注释并修改为实际值：

\`\`\`yaml
sso:
  enabled: true
  provider_url: "https://login.microsoftonline.com/{tenant}/v2.0"  # OIDC 发现地址
  client_id: "your-client-id"                                       # 应用客户端 ID
  client_secret: "your-client-secret"                                # 客户端密钥
  redirect_url: "http://localhost:3000/auth/sso/callback"           # 回调地址
  default_role_id: 2                                                # SSO 用户默认角色 ID
\`\`\`

#### 支持的 OIDC 提供商

| 提供商 | Provider URL |
|--------|-------------|
| Azure AD | \`https://login.microsoftonline.com/{tenant-id}/v2.0\` |
| Okta | \`https://{your-org}.okta.com\` |
| Keycloak | \`https://{host}/realms/{realm}\` |
| Auth0 | \`https://{your-tenant}.auth0.com\` |
| Google | \`https://accounts.google.com\` |

#### 工作原理

1. 用户点击「SSO 单点登录」按钮
2. 前端请求 \`GET /api/auth/sso/login\`，后端返回 OIDC 授权 URL
3. 前端跳转到身份提供商（如 Azure AD）登录页
4. 用户完成认证后，身份提供商回调 \`redirect_url\`（\`/auth/sso/callback\`）
5. 前端 SSOCallback 页面提取 \`code\` 和 \`state\` 参数
6. 后端用 \`code\` 交换 token，验证 \`id_token\`，解析用户信息
7. 本地 \`users\` 表查找或自动创建用户（\`auth_source = 'sso'\`）
8. 返回 JWT token，页面跳转到仪表盘

#### SSO 回调地址配置

需要在身份提供商的应用配置中将回调地址加入白名单：

\`\`\`
http://localhost:3000/auth/sso/callback   # 开发环境
https://your-domain.com/auth/sso/callback # 生产环境
\`\`\`

#### 注意事项

- 前端路径 \`/auth/sso/callback\` 必须与 \`redirect_url\` 一致
- \`state\` 参数用于防止 CSRF 攻击，存储在 \`sso_states\` 表中，10 分钟过期
- \`nonce\` 参数用于防止重放攻击
- 首次 SSO 登录会自动创建本地用户
- 修改 SSO 配置后需重启后端

### API Key 认证

API Key 为固定密钥，适用于自动化脚本、收银台 checkin 上报等无需用户交互的场景。

#### 配置方式

编辑 \`backend/config.yaml\`：

\`\`\`yaml
api_key: "my-secret-api-key-2026"   # 建议生产环境改为随机字符串
\`\`\`

修改后需重启后端生效。

#### 调用方式

在所有需要认证的请求中，添加 \`X-API-Key\` 请求头：

\`\`\`bash
curl -X POST http://localhost:8080/api/till-lists/checkin \
  -H "Content-Type: application/json" \
  -H "X-API-Key: my-secret-api-key-2026" \
  -d @request_body.json
\`\`\`

前端 Axios 调用（Node.js / 浏览器）：

\`\`\`typescript
import axios from 'axios';

const res = await axios.post('/api/till-lists/checkin', body, {
  headers: { 'X-API-Key': 'my-secret-api-key-2026' }
});
\`\`\`

PowerShell 调用（收银台脚本）：

\`\`\`powershell
$body = Get-Content -Path "report.json" -Raw
Invoke-RestMethod -Uri "http://server:8080/api/till-lists/checkin" \`
  -Method Post \`
  -ContentType "application/json" \`
  -Headers @{ "X-API-Key" = "my-secret-api-key-2026" } \`
  -Body $body
\`\`\`

#### 工作原理

1. 中间件优先检查 \`X-API-Key\` 请求头
2. 如果匹配 \`config.yaml\` 中配置的 \`api_key\`，直接放行（设置 \`user_id=0\`, \`username="api-key"\`, \`role_code="api"\`）
3. 如果不匹配或未提供，回退到 JWT Bearer Token 验证
4. API Key 验证通过后与 JWT 用户享有相同路由权限

#### 注意事项

- API Key 为全局密钥，所有使用该 Key 的请求共享同一个身份（\`api-key\`）
- 如需区分不同客户端，建议为每个客户端创建独立的 API Key（后续可扩展）
- 建议生产环境使用 \`openssl rand -hex 32\` 生成高强度密钥
- API Key 与 JWT 是**或**关系，任一通过即可访问

`;

/* ---- Simple Markdown Renderer ---- */
function render(md) {
  let html = '';
  const lines = md.split('\n');
  let i = 0;
  let inCodeBlock = false;
  let codeBuf = [];

  function flushCode() {
    if (codeBuf.length) {
      const lang = codeBuf[0] || '';
      const code = codeBuf.slice(1).join('\n');
      html += `<pre><code class="language-${lang}">${escapeHtml(code)}</code></pre>`;
      codeBuf = [];
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  while (i < lines.length) {
    const raw = lines[i];
    const line = raw.trimEnd();

    // code block fence
    if (/^```/.test(line)) {
      if (inCodeBlock) {
        inCodeBlock = false;
        flushCode();
        i++;
        continue;
      } else {
        inCodeBlock = true;
        codeBuf = [line.slice(3).trim()];
        i++;
        continue;
      }
    }
    if (inCodeBlock) {
      codeBuf.push(raw);
      i++;
      continue;
    }

    // headings
    const hMatch = line.match(/^(#{1,3})\s+(.+)$/);
    if (hMatch) {
      const level = hMatch[1].length;
      html += `<h${level}>${inline(hMatch[2])}</h${level}>\n`;
      i++;
      continue;
    }

    // hr
    if (/^-{3,}$/.test(line.trim())) {
      html += '<hr>\n';
      i++;
      continue;
    }

    // table
    if (line.startsWith('|') && lines[i+1] && /^\|[\s:-]+\|/.test(lines[i+1])) {
      let tableRows = [];
      while (i < lines.length && lines[i].startsWith('|')) {
        tableRows.push(lines[i]);
        i++;
      }
      html += renderTable(tableRows);
      continue;
    }

    // ul
    if (/^(\s*[-*+]\s)/.test(line)) {
      let listLines = [];
      while (i < lines.length && /^\s*[-*+]\s/.test(lines[i])) {
        listLines.push(lines[i].replace(/^\s*[-*+]\s/, ''));
        i++;
      }
      html += '<ul>\n' + listLines.map(l => `<li>${inline(l)}</li>`).join('\n') + '\n</ul>\n';
      continue;
    }

    // ol
    if (/^\s*\d+\.\s/.test(line)) {
      let listLines = [];
      while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) {
        listLines.push(lines[i].replace(/^\s*\d+\.\s/, ''));
        i++;
      }
      html += '<ol>\n' + listLines.map(l => `<li>${inline(l)}</li>`).join('\n') + '\n</ol>\n';
      continue;
    }

    // empty line
    if (line === '') {
      i++;
      continue;
    }

    // paragraph
    html += `<p>${inline(line)}</p>\n`;
    i++;
  }
  flushCode();
  return html;
}

function renderTable(rows) {
  let html = '<table>\n';
  // header
  const headerCells = rows[0].split('|').filter(c => c.trim() !== '');
  html += '<thead><tr>' + headerCells.map(c => `<th>${inline(c.trim())}</th>`).join('') + '</tr></thead>\n';
  // body
  html += '<tbody>\n';
  for (let r = 2; r < rows.length; r++) {
    const cells = rows[r].split('|').filter(c => c.trim() !== '');
    html += '<tr>' + cells.map(c => `<td>${inline(c.trim())}</td>`).join('') + '</tr>\n';
  }
  html += '</tbody>\n</table>\n';
  return html;
}

function inline(text) {
  // code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // italic
  text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return text;
}

/* ---- Build TOC ---- */
function buildToc(md) {
  const toc = document.getElementById('toc');
  const lines = md.split('\n');
  const items = [];
  for (const line of lines) {
    const h2 = line.match(/^##\s+(.+)$/);
    if (h2) {
      items.push({ level: 2, text: h2[1] });
    }
    const h3 = line.match(/^###\s+(.+)$/);
    if (h3) {
      items.push({ level: 3, text: h3[1] });
    }
  }
  items.forEach((item, idx) => {
    const id = `s${idx}`;
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = item.text;
    if (item.level === 3) a.className = 'l2';
    const li = document.createElement('li');
    li.appendChild(a);
    toc.appendChild(li);
  });
  return items;
}

/* ---- Annotate headings with IDs ---- */
function annotateHeadings(html, items) {
  let idx = 0;
  return html.replace(/<(h[23])>(.+?)<\/h[23]>/g, (match, tag, content) => {
    if (idx < items.length) {
      const id = `s${idx}`;
      idx++;
      return `<${tag} id="${id}">${content}</${tag}>`;
    }
    return match;
  });
}

/* ---- Init ---- */
const items = buildToc(md);
let rendered = render(md);
rendered = annotateHeadings(rendered, items);
document.getElementById('content').innerHTML = rendered;

/* ---- Scroll spy ---- */
const tocLinks = document.querySelectorAll('.toc a');
const headings = document.querySelectorAll('h2[id], h3[id]');
if (headings.length) {
  const observer = new IntersectionObserver(entries => {
    let current = '';
    for (const entry of entries) {
      if (entry.isIntersecting) { current = entry.target.id; }
    }
    tocLinks.forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + current);
    });
  }, { rootMargin: '-60px 0px -60% 0px' });
  headings.forEach(h => observer.observe(h));
}
</script>
